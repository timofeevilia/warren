name: Deploy

# Builds the static site and syncs dist/ to the hosting with rsync over SSH.
# Repository secrets:
#   SSH_HOST         server hostname
#   SSH_USER         hosting account user
#   SSH_PRIVATE_KEY  private half of a key authorised on the server
#   SSH_PORT         optional, defaults to 22
#   DEPLOY_PATH      absolute path of the subdomain's document root

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync to hosting
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # rsync --delete removes anything on the server that is not in dist/.
          # Refuse to run unless the target is clearly this site's own folder.
          case "$DEPLOY_PATH" in
            /*warren*) ;;
            *) echo "DEPLOY_PATH must be an absolute path containing 'warren'"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Keep files the hosting itself puts there (SSL validation, cgi-bin).
          rsync -az --delete \
            --filter='P .well-known/' --filter='P cgi-bin/' \
            -e "ssh -p $PORT -i ~/.ssh/deploy_key" \
            dist/ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"
